# Source registry.
#
# Every connector lives under backend/src/prisma/ingest/ and implements the same
# interface: fetch -> normalize to the common schema (variable, unit, lat, lon,
# time, source, quality_flag) -> store as Parquet. Adding a source must require
# changes only in its connector module and this file.
#
# status:  active   -> implemented and used by the pipeline
#          planned  -> registered, connector not implemented yet
#          blocked  -> access verified as unavailable from this environment
#
# redistributable: yes | no | derived_only | unknown
#
# day_convention: how the source aggregates a value into a day; recorded per
#   source here and carried in every stored row. See docs/DATA_SOURCES.md.
#     utc            -> timestamped and aggregated in UTC
#     local_calendar -> aggregated over the local calendar day at the location
#     obs_hour_XX    -> value taken at a fixed observation hour (XX, 0-23 UTC)
#     unknown        -> not verified yet; must be resolved before status: active
#
# Integration order follows the project plan: Tier 1 first.

version: 1

sources:
  # ---------------------------------------------------------------------------
  # Tier 1
  # ---------------------------------------------------------------------------
  - id: openmeteo-ensemble
    name: "Open-Meteo Ensemble API"
    day_convention: local_calendar
    connector: "openmeteo.OpenMeteoEnsemble"
    tier: 1
    status: active
    variables: [t2m_max, t2m_min, precip]
    access: "REST API, no key"
    endpoint: "https://ensemble-api.open-meteo.com/v1/ensemble"
    coverage: global
    latency: "hours"
    update_frequency: "6 hours"
    license: "Open-Meteo CC BY 4.0; free tier is non-commercial only"
    redistributable: derived_only
    verified_on: "2026-11-11"
    notes: "GFS ensemble has 30 members, ECMWF IFS 0.25 has 50."
    options:
      models: [gfs_seamless, ecmwf_ifs025]
      forecast_days: 16

  - id: openmeteo-era5
    name: "Open-Meteo Historical Weather API (ERA5)"
    day_convention: local_calendar
    connector: "openmeteo.OpenMeteoEra5"
    tier: 1
    status: active
    variables: [t2m_max, t2m_min, precip]
    access: "REST API, no key"
    endpoint: "https://archive-api.open-meteo.com/v1/archive"
    coverage: global
    latency: "about 5 days behind real time"
    update_frequency: daily
    license: "Open-Meteo CC BY 4.0; underlying ERA5 under the Copernicus licence"
    redistributable: derived_only
    verified_on: "2026-11-11"
    notes: "Gridded reanalysis, not a station measurement. Values are the grid cell nearest each station."
    options:
      models: [era5]
      pause_seconds: 7
      incremental: true

  - id: ghcn-daily
    name: "NOAA GHCN-Daily"
    day_convention: local_calendar
    connector: "ghcn.GhcnDaily"
    tier: 1
    status: active
    variables: [t2m_max, t2m_min, precip]
    access: "HTTPS fixed-width files, no key"
    endpoint: "https://www.ncei.noaa.gov/pub/data/ghcn/daily/all/{station_id}.dly"
    coverage: global
    latency: "days"
    update_frequency: daily
    license: "Public domain (NOAA/NCEI, U.S. Government)"
    redistributable: yes
    verified_on: "2026-11-11"
    notes: "Primary observation source. Station IDs are declared per region in configs/regions/."
    options:
      min_year: 1996

  - id: noaa-oni
    name: "NOAA ONI (Oceanic Nino Index)"
    day_convention: utc
    connector: "indices.NoaaOni"
    tier: 1
    status: active
    variables: [oni]
    access: "HTTPS ASCII, no key"
    endpoint: "https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt"
    coverage: "Nino 3.4 region"
    latency: "weeks"
    update_frequency: monthly
    license: "Public domain (NOAA/NWS, U.S. Government)"
    redistributable: yes
    verified_on: "2026-11-11"
    notes: "3-month running means; mapped to the centre month of each season."

  - id: noaa-sam
    name: "NOAA CPC Antarctic Oscillation (SAM) index"
    day_convention: utc
    connector: "indices.NoaaSam"
    tier: 1
    status: active
    variables: [sam]
    access: "HTTPS ASCII table, no key"
    endpoint: "https://www.cpc.ncep.noaa.gov/products/precip/CWlink/daily_ao_index/aao/monthly.aao.index.b79.current.ascii.table"
    coverage: "Southern hemisphere extratropics"
    latency: "weeks"
    update_frequency: monthly
    license: "Public domain (NOAA/NWS, U.S. Government)"
    redistributable: yes
    verified_on: "2026-11-11"

  - id: smn-argentina
    name: "Servicio Meteorologico Nacional (Argentina)"
    day_convention: local_calendar
    connector: "smn.SmnObservations"
    tier: 1
    status: active
    variables: [t2m_max, t2m_min]
    access: "Open data on ssl.smn.gob.ar (no auth); www.smn.gob.ar serves a Cloudflare JS challenge to plain clients"
    endpoint: "https://ssl.smn.gob.ar/dpd/zipopendata.php?dato=observaciones"
    coverage: Argentina
    latency: "hours"
    update_frequency: daily
    license: "CC BY 2.5 AR; attribution to SMN required (PAD_legales.pdf, Infoleg disp25.pdf)"
    redistributable: yes
    verified_on: "2026-11-11"
    notes: >-
      Core source. Access re-verified 2026-11-11: ssl.smn.gob.ar/dpd/zipopendata.php?dato={estaciones,
      observaciones, tiepre, datohorario, regtemp, radsolar, pron5d} returns 200 with no challenge.
      Licence terms read 2026-11-11: PAD_legales.pdf (Propiedad Intelectual) licenses "todos sus
      contenidos" under CC BY 2.5 AR; Infoleg disp25.pdf (Política de Datos del SMN) puts raw
      observational data in category A "Datos Abiertos" under the same licence with attribution.
      day_convention local_calendar verified from the payload: datohorario carries FECHA DDMMYYYY
      plus HORA in [HOA] covering the local day 0-23, and observaciones is one TMAX/TMIN row per
      local calendar day (the fecha query parameter is ignored, so only the latest completed day
      is served). Connector ingests observaciones -> t2m_max/t2m_min and merges each new day into
      data/raw/smn-argentina.parquet. Catalogue reconciliation: 124 physical lines = 2 blank +
      header + units + 118 station rows + 2 name-wrap fragments (ERO, RO); 118 stations parse and
      118 appear in observaciones.
    options: {}

