  - id: imerg
    name: "NASA IMERG Late Run (GPM precipitation, L3 daily)"
    day_convention: utc
    connector: "imerg.Imerg"
    tier: 2
    status: planned
    variables: [precip]
    access: "CMR metadata open over HTTPS; data files require Earthdata Login (free registration); PPS NRT requires email registration"
    endpoint: "https://data.gesdisc.earthdata.nasa.gov/data/GPM_L3/GPM_3IMERGDL.07/{yyyy}/{mm}/{granule}.nc4"
    coverage: "global, 0.1 degree (all latitudes except boxes very near the poles, per V07)"
    latency: "observed 1 day: daily granule for obs day T ingested ~14:30 UTC on T+1 (Late)"
    update_frequency: "daily"
    license: "NASA GPM data usage policy: data freely available at all processed levels; citation requested (https://gpm.nasa.gov/data/policy)"
    redistributable: yes
    verified_on: "2026-11-12"
    notes: >-
      Tier 2 verification 2026-11-12, see docs/DATA_SOURCES.md section "Tier 2 verification — 2026-11-12".
      Product pinned: IMERG Late Run L3 daily 0.1 degree, collection GPM_3IMERGDL version 07 (granule
      algorithm id V07C observed). Family probed: Early (GPM_3IMERGDE.07, obs day 2026-11-11 ingested
      2026-11-12T04:31:43Z) and Final (GPM_3IMERGDF.07, latest obs day 2025-09-30, ~13.5 months behind
      at run time). Empirical latency evidence: open CMR granule metadata (short_name+version query,
      HTTP 200) shows the latest Late granule covering obs day 2026-11-11 with updated
      2026-11-12T14:32:02Z. Data-file GET without credentials returns HTTP 302 to
      urs.earthdata.nasa.gov oauth (access requires Earthdata Login; GES DISC banner quote recorded in
      the doc section); PPS NRT returns HTTP 401 and the GPM directory documents email registration.
      GES DISC also notes its HTTPS servers migrate to Earthdata Cloud, access ending no earlier than
      2026-09-30. day_convention utc from the granule CMR time_start/time_end
      2026-11-11T00:00:00.000Z-23:59:59.999Z and the -S000000-E235959 filename span. Verification
      only, no connector written; candidate SECONDARY / spatial-proxy reference pending a future dated
      protocol amendment.

