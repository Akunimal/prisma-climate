  - id: smn-argentina
    name: "Servicio Meteorologico Nacional (Argentina)"
    day_convention: local_calendar
    connector: "smn.SmnObservations"
    tier: 1
    status: active
    variables: [t2m_max, t2m_min]
    access: "Open data on ssl.smn.gob.ar (no auth); www.smn.gob.ar serves a Cloudflare JS challenge to plain clients"
    endpoint: "https://ssl.smn.gob.ar/dpd/zipopendata.php?dato=observaciones"
    coverage: Argentina
    latency: "hours"
    update_frequency: daily
    license: "CC BY 2.5 AR; attribution to SMN required (PAD_legales.pdf, Infoleg disp25.pdf)"
    redistributable: yes
    verified_on: "2026-11-11"
    notes: >-
      Core source. Access re-verified 2026-11-11: ssl.smn.gob.ar/dpd/zipopendata.php?dato={estaciones,
      observaciones, tiepre, datohorario, regtemp, radsolar, pron5d} returns 200 with no challenge.
      Licence terms read 2026-11-11: PAD_legales.pdf (Propiedad Intelectual) licenses "todos sus
      contenidos" under CC BY 2.5 AR; Infoleg disp25.pdf (Política de Datos del SMN) puts raw
      observational data in category A "Datos Abiertos" under the same licence with attribution.
      day_convention local_calendar verified from the payload: datohorario carries FECHA DDMMYYYY
      plus HORA in [HOA] covering the local day 0-23, and observaciones is one TMAX/TMIN row per
      local calendar day (the fecha query parameter is ignored, so only the latest completed day
      is served). Connector ingests observaciones -> t2m_max/t2m_min and merges each new day into
      data/raw/smn-argentina.parquet. Catalogue reconciliation: 124 physical lines = 2 blank +
      header + units + 118 station rows + 2 name-wrap fragments (ERO, RO); 118 stations parse and
      118 appear in observaciones. Precipitation is pending, not guessed: probed 2026-11-11,
      datohorario carries FECHA HORA TEMP HUM PNM DD FF NOMBRE with units [HOA] [degC] [%] [hPa]
      [gr] [km/hr] and no precip field at all, observaciones and regtemp carry only FECHA/TMAX/
      TMIN/NOMBRE, and dato=precipitacion|precipitaciones|precip|lluvia|precipitacion_diaria|
      precipitacion30d|precip30d|lluvias all return an empty ZIP (zero members), so there is
      nothing to aggregate to the local calendar day. regtemp was probed and serves
      registro_temperatura365d_smn.txt (42,953 rows, 365 local days 2025-11-11..2026-11-10, 118
      distinct station names under fixed-column parse; a whitespace split invents ~135 tokens from
      blank TMAX/TMIN rows): a candidate t2m_max/t2m_min backfill over the GHCN staleness gap,
      recorded but not wired. observaciones ignores fecha and serves only the latest completed day,
      so the live series accumulates forward with no backfill through that endpoint.
    options: {}

