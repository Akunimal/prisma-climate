# Deployment region: Argentina.
#
# Argentina is the first instance of a system designed to scale globally.
# Adding a country must only require a new file in this directory, never a code
# change. Station identifiers are NOAA GHCN-Daily IDs; no country-specific logic
# is allowed outside a connector module.
#
# Phase 0 uses gridded reanalysis (ERA5 via Open-Meteo) at these coordinates and
# station observations from GHCN-Daily. SMN Argentina is a core source of the
# project (registered in configs/sources.yaml); its open-data endpoints on
# ssl.smn.gob.ar were verified reachable on 2026-11-11, and the connector lands
# in Phase 1 once payload formats and licence terms are recorded.
#
# Coordinate provenance (verified 2026-11-11):
#   lat/lon below are the full-precision values from the NOAA GHCN-Daily
#   station inventory ghcnd-stations.txt
#   (https://www.ncei.noaa.gov/pub/data/ghcn/daily/ghcnd-stations.txt),
#   read with the fixed-width columns specified in the official readme
#   (https://www.ncei.noaa.gov/pub/data/ghcn/daily/readme.txt, section IV):
#   ID 1-11, LATITUDE 13-20, LONGITUDE 22-30, ELEVATION 32-37.
#   All 19 ghcn_ids matched with delta 0.0000 degrees on both axes.
#   elevation_m is that inventory ELEVATION rounded to the nearest metre
#   (largest rounding delta 0.4 m, at Ushuaia). GHCN .dly data files carry no
#   coordinates of their own; this inventory is the authoritative source.
#
# Station selection criteria (Phase 0, verified 2026-11-11):
#   1. Prefer stations present in BOTH GHCN-Daily and SMN Argentina with
#      recent data. GHCN presence and recency were checked against
#      ghcnd-inventory.txt: every station below reports TMAX, TMIN and PRCP
#      through 2025 (the inventory file lags real time by months).
#   2. SMN cross-check completed 2026-11-11: all 19 stations matched an entry
#      in the SMN catalogue (data/smn_probe/estaciones/estaciones_smn.txt) by
#      NRO within 0.05 degrees / 50 m (results/stations/ghcn_vs_smn.md).
#      This is a catalogue cross-check only; it does not claim live SMN data
#      series for these stations. Comodoro Rivadavia sits exactly on the
#      longitude threshold (|delta_lon| = 0.050 degrees vs SMN; the test flags
#      only > 0.05), so treat its lon as borderline in SMN comparisons.
#   3. Coverage: at least one station per climate zone (NOA/Puna, NEA/Chaco,
#      Cuyo, Pampa, Atlantic coast, Patagonia), spanning latitude and
#      elevation, so no zone of the country is unrepresented.
#   4. GHCN recency: the newest ok GHCN-Daily observation across all stations
#      is 2025-08-24 (444 days before 2026-11-11; audit:
#      results/qc/freshness.md). No station's record stops before the last two
#      years, so none is flagged out under the original rule; the source-side
#      lag is documented there instead.

id: argentina
