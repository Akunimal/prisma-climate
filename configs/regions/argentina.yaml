# Deployment region: Argentina.
#
# Argentina is the first instance of a system designed to scale globally.
# Adding a country must only require a new file in this directory, never a code
# change. Station identifiers are NOAA GHCN-Daily IDs; no country-specific logic
# is allowed outside a connector module.
#
# Phase 0 uses gridded reanalysis (ERA5 via Open-Meteo) at these coordinates and
# station observations from GHCN-Daily. SMN Argentina is a core source of the
# project (registered in configs/sources.yaml); its open-data endpoints on
# ssl.smn.gob.ar were verified reachable on 2026-11-11, and the connector lands
# in Phase 1 once payload formats and licence terms are recorded.
#
# Station selection criteria (Phase 0, verified 2026-11-11):
#   1. Prefer stations present in BOTH GHCN-Daily and SMN Argentina with
#      recent data. GHCN presence and recency were checked against
#      ghcnd-inventory.txt: every station below reports TMAX, TMIN and PRCP
#      through 2025 (the inventory file lags real time by months).
#   2. SMN membership is not claimed yet: the SMN station list endpoint
#      (ssl.smn.gob.ar/dpd/zipopendata.php?dato=estaciones) is reachable but
#      has not been parsed and matched against these GHCN IDs. The cross-check
#      happens in Phase 1; a station missing from SMN will be replaced then.
#   3. Coverage: at least one station per climate zone (NOA/Puna, NEA/Chaco,
#      Cuyo, Pampa, Atlantic coast, Patagonia), spanning latitude and
#      elevation, so no zone of the country is unrepresented.
#   4. Stations without recent GHCN data: none as of 2026-11-11. If a
#      station's GHCN record stops before the last two years, flag it in the
#      station entry with a comment; keep it only if zone coverage needs it.

id: argentina
name: Argentina
description: "Starting with Argentina, designed to scale globally."
timezone: America/Argentina/Cordoba
history_start: "1996-01-01"

