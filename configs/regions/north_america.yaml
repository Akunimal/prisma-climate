# Deployment region: North America.
#
# Regional expansion covering key representative climate zones across North America
# (United States, Canada, and Mexico).
# Station identifiers carry ICAO airport codes for unified METAR observation bridge
# support and NOAA GHCN-Daily IDs where mapped.
#
# Coordinate provenance:
#   lat/lon below are official aerodrome coordinates (ICAO/FAA/Transport Canada/SENEAM)
#   and NOAA GHCN-Daily inventory stations.
#
# Observation strategy:
#   - Forecasts: Open-Meteo Ensemble (GFS + ECMWF IFS) operates globally at any lat/lon.
#   - Real-time observations: METAR network via ICAO aerodrome identifiers (ASOS/AWOS).
#   - National connectors (NOAA NCEI, Environment and Climate Change Canada, CONAGUA/SMN Mexico)
#     to be integrated progressively as open-data adapters are verified.

id: north_america
name: "North America"
description: "Regional expansion covering major climate zones across North America."
timezone: America/New_York
history_start: "1996-01-01"

