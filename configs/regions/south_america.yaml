# Deployment region: South America.
#
# Regional expansion covering key representative climate zones across South America.
# Station identifiers carry ICAO airport codes for unified METAR observation bridge
# support and NOAA GHCN-Daily IDs where mapped.
#
# Coordinate provenance:
#   lat/lon below are official aerodrome coordinates (ICAO/WMO) and NOAA GHCN-Daily
#   inventory stations.
#
# Observation strategy:
#   - Forecasts: Open-Meteo Ensemble (GFS + ECMWF IFS) operates globally at any lat/lon.
#   - Real-time observations: METAR network via ICAO aerodrome identifiers.
#   - National connectors (Chile DMC, Uruguay INUMET, Brazil INMET, Peru SENAMHI,
#     Bolivia SENAMHI, Colombia IDEAM) to be integrated progressively country by country.

id: south_america
name: "South America"
description: "Regional expansion covering major climate zones across South America."
