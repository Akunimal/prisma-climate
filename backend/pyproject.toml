[project]
name = "prisma-climate"
version = "0.1.0"
description = "Open climate forecast verification, starting with Argentina"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "duckdb>=1.1",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6.0",
  "requests>=2.32",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8.2",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prisma"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
