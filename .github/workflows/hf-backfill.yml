# One-shot reconciliation for the Hugging Face dataset.
#
# Publishes the canonical 2026-11-11 archive (the ORIGINAL Release asset) and
# the generated dataset card to Akunimal/prisma-climate. The write token never
# leaves GitHub Actions: every write uses secrets.HF_TOKEN plus
# vars.HF_DATASET_REPO, and the token is never printed or written to a log.
#
# The observations leg mirrors the locally captured 2026-11-10 regtemp snapshot
# from its GitHub Release (tag observations-regtemp-2026-11-10) into
# observations/smn/regtemp/2026-11-10/, in one commit, after re-checking both
# pinned sha256 values. It is a mirror, not a capture: the payload was retrieved
# on 2026-11-12 and cannot be re-fetched, because the endpoint serves a rolling
# 365-day window. The manifest published there is regenerated by
# scripts/capture_observations.py from the Release assets, never hand-edited.
#
# Both legs are idempotent: when the target already holds the canonical sha256
# the parquet is skipped, and the capture is skipped when payload and manifest
# are both present, so re-running this workflow is a no-op for the data. A
# forecast file at the same path with a different sha256 is replaced once, and
# the revision that held it is recorded in the dataset card; Hugging Face keeps
# git history, so the superseded blob stays readable.
#
# This workflow is workflow_dispatch only: never scheduled, never triggered by
# a push. Runners: standard ubuntu-latest only.

name: Hugging Face backfill

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-backfill
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check that Hugging Face is configured
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_DATASET_REPO" ]; then
            echo "::error::HF_TOKEN (secret) or HF_DATASET_REPO (variable) is not configured"
            exit 1
          fi
          echo "Dataset repo configured: ${HF_DATASET_REPO}"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --project backend

      - name: Download the canonical archive from its Release
        run: |
          mkdir -p data/archive
          gh release download forecast-2026-11-11 \
            --repo "${{ github.repository }}" \
            --pattern "openmeteo-ensemble_2026-11-11.parquet" \
            --dir data/archive \
            --clobber
          echo "88c23d04d21d391215bb99277e5b24b926e015367f3c0bb0b62952b9b29dde6c  data/archive/openmeteo-ensemble_2026-11-11.parquet" \
            | sha256sum --check --strict -
          echo "Release asset matches the expected sha256"

      - name: Read the Hugging Face state before any write
        id: state
        run: |
          CANONICAL_SHA="88c23d04d21d391215bb99277e5b24b926e015367f3c0bb0b62952b9b29dde6c"
          TARGET="forecasts/2026-11-11/openmeteo-ensemble_2026-11-11.parquet"
          PRE_REV=$(curl -fsSL "https://huggingface.co/api/datasets/${HF_DATASET_REPO}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha") or "")')
          CODE=$(curl -sSL -o existing.parquet \
            -w '%{http_code}' \
            "https://huggingface.co/datasets/${HF_DATASET_REPO}/resolve/main/${TARGET}") || CODE=000
          if [ "$CODE" = "200" ]; then
            EXISTING_SHA=$(sha256sum existing.parquet | cut -d' ' -f1)
          else
            EXISTING_SHA=""
          fi

          if [ "$EXISTING_SHA" = "$CANONICAL_SHA" ]; then
            ACTION="skip the parquet: the target already holds the canonical sha256"
            REPLACE=""
          elif [ -n "$EXISTING_SHA" ]; then
            ACTION="replace the non-canonical file once (one-time reconciliation)"
            REPLACE="--replace"
          else
            ACTION="upload: no file at the target path"
            REPLACE=""
          fi

          {
            echo "pre_revision=${PRE_REV}"
            echo "existing_sha=${EXISTING_SHA}"
            echo "replace=${REPLACE}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Hugging Face backfill"
            echo
            echo "- dataset revision before any write: \`${PRE_REV}\`"
            echo "- sha256 already at the target: \`${EXISTING_SHA:-none}\`"
            echo "- parquet action: ${ACTION}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Read HF state: pre_revision=${PRE_REV} existing_sha=${EXISTING_SHA:-none}"

      - name: Generate the dataset card
        env:
          PRE_REVISION: ${{ steps.state.outputs.pre_revision }}
          EXISTING_SHA: ${{ steps.state.outputs.existing_sha }}
        run: |
          if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "88c23d04d21d391215bb99277e5b24b926e015367f3c0bb0b62952b9b29dde6c" ]; then
            uv run --project backend python scripts/generate_dataset_card.py \
              --out docs/HF_DATASET_CARD.md \
              --superseded-revision "$PRE_REVISION" \
              --superseded-sha256 "$EXISTING_SHA"
          else
            uv run --project backend python scripts/generate_dataset_card.py \
              --out docs/HF_DATASET_CARD.md
          fi

      - name: Upload archive and dataset card to Hugging Face
        env:
          REPLACE: ${{ steps.state.outputs.replace }}
        run: |
          uv run --project backend --with huggingface_hub \
            python scripts/upload_forecast.py \
            --archive-dir data/archive \
            --issue-date 2026-11-11 \
            $REPLACE \
            --card docs/HF_DATASET_CARD.md

      - name: Report the Hugging Face state after the write
        run: |
          curl -fsSL "https://huggingface.co/api/datasets/${HF_DATASET_REPO}?full=1" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("revision after write:", d.get("sha")); [print("  ", s.get("rfilename")) for s in d.get("siblings", [])]' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify the published parquet byte-for-byte
        run: |
          CANONICAL_SHA="88c23d04d21d391215bb99277e5b24b926e015367f3c0bb0b62952b9b29dde6c"
          TARGET="forecasts/2026-11-11/openmeteo-ensemble_2026-11-11.parquet"
          curl -fsSL -o published.parquet \
            "https://huggingface.co/datasets/${HF_DATASET_REPO}/resolve/main/${TARGET}"
          PUBLISHED_SHA=$(sha256sum published.parquet | cut -d' ' -f1)
          POST_REV=$(curl -fsSL "https://huggingface.co/api/datasets/${HF_DATASET_REPO}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha") or "")')
          if [ "$PUBLISHED_SHA" != "$CANONICAL_SHA" ]; then
            echo "::error::published sha256 ${PUBLISHED_SHA} does not equal the canonical ${CANONICAL_SHA}"
            echo "- **VERIFY FAILED:** published \`${PUBLISHED_SHA}\` != expected \`${CANONICAL_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo
            echo "### Post-write verification"
            echo
            echo "- re-downloaded sha256: \`${PUBLISHED_SHA}\` (matches canonical)"
            echo "- post-write dataset revision: \`${POST_REV}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Verified published sha256=${PUBLISHED_SHA} at revision ${POST_REV}"

  observations:
    # Serialized behind the forecast leg so two commits never race on the same
    # branch. always() keeps the capture publishing even when the forecast leg
    # fails, so the two legs keep separate failure domains.
    needs: backfill
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check that Hugging Face is configured
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_DATASET_REPO" ]; then
            echo "::error::HF_TOKEN (secret) or HF_DATASET_REPO (variable) is not configured"
            exit 1
          fi
          echo "Dataset repo configured: ${HF_DATASET_REPO}"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --project backend

      - name: Download the observations capture from its Release
        run: |
          mkdir -p data/observations-release
          gh release download observations-regtemp-2026-11-10 \
            --repo "${{ github.repository }}" \
            --pattern "regtemp.zip" \
            --pattern "manifest.json" \
            --dir data/observations-release \
            --clobber
          echo "28b166d87e618df127cb2e7bb932e4b6c813b0ab4e489e860cc542bf5902af98  data/observations-release/regtemp.zip" \
            | sha256sum --check --strict -
          echo "Release asset matches the expected sha256"

      - name: Publish the capture to observations/smn/regtemp/2026-11-10/
        # The sha256 of the ZIP and of its text member are re-checked inside the
        # script (both pinned here), the key is derived from the payload's last
        # FECHA, and payload + manifest leave in ONE commit. An existing target
        # is skipped, so a re-run never overwrites what is already published.
        run: >
          uv run --project backend --with huggingface_hub
          python scripts/capture_observations.py
          --payloads regtemp
          --release-assets data/observations-release
          --release-tag observations-regtemp-2026-11-10
          --expected-sha256 28b166d87e618df127cb2e7bb932e4b6c813b0ab4e489e860cc542bf5902af98
          --expected-member-sha256 c8620c4c4c0b4096143c4c9bc3e5007dc56789b68ef2318231f3e6c51cc065a6
          --upload

      - name: Verify the published capture (read-only)
        run: |
          TARGET="observations/smn/regtemp/2026-11-10"
          mkdir -p published
          for asset in regtemp.zip manifest.json; do
            curl -fsSL -o "published/${asset}" \
              "https://huggingface.co/datasets/${HF_DATASET_REPO}/resolve/main/${TARGET}/${asset}"
          done
          echo "28b166d87e618df127cb2e7bb932e4b6c813b0ab4e489e860cc542bf5902af98  published/regtemp.zip" \
            | sha256sum --check --strict -
          python3 - <<'PY'
          import json
          import pathlib

          body = json.loads(pathlib.Path("published/manifest.json").read_text())
          assert body["capture_key"] == "2026-11-10", body["capture_key"]
          assert (
              body["sha256_zip"]
              == "28b166d87e618df127cb2e7bb932e4b6c813b0ab4e489e860cc542bf5902af98"
          ), body["sha256_zip"]
          assert body["retrieval"]["mode"] == "local", body["retrieval"]
          assert (
              body["publication"]["channel"] == "github_release_mirror"
          ), body["publication"]
          assert (
              body["publication"]["release_tag"] == "observations-regtemp-2026-11-10"
          ), body["publication"]
          print("published manifest verified:", body["hf_target"])
          PY

