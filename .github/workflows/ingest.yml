# Daily forecast archive.
#
# Past ensemble forecasts are only partially retrievable from the provider:
# member data is retained for about 3 days, so a very recent missed day can be
# repaired inside that window; beyond it no uniform-cycle ensemble backfill
# exists, so a missed day is lost verification data. This workflow therefore
# runs daily, stores the forecast with its issue time, and uploads the archive
# outside git.
#
# Storage policy:
#   - Raw/archived data is NEVER committed to this repository.
#   - GitHub Actions artifacts are NOT used as storage (they expire).
#   - Primary store: a public Hugging Face Dataset (secrets.HF_TOKEN plus
#     vars.HF_DATASET_REPO). The archive key is the forecast issue_time date
#     read from the parquet, never the wall clock, and an existing target is
#     skipped so the first archive of an issue date stays canonical.
#   - GitHub Release fallback: used when HF is unconfigured OR the HF upload
#     step fails, so a transient Hugging Face error never loses a day. The
#     Release is kept as provenance even after a successful HF upload.
#   - The only committed file is results/ingest_status.json (last run, rows per
#     source, failures), so scheduled workflows are not disabled for inactivity.
#
# Runners: standard ubuntu-latest only.

name: Daily forecast archive

on:
  schedule:
    # Redundant same-day slots: GitHub schedules are best-effort and can be
    # delayed or dropped under load, so several off-hour attempts reduce the
    # chance a day is lost. The issue-dated target makes repeats no-ops.
    # Observed on 2026-11-12: the three schedule runs started at 15:37, 19:52
    # and 23:44 UTC, hours after their nominal slots (docs/DATA_SOURCES.md).
    # Attempts are therefore weighted into 09:00-15:00 UTC, where a
    # multi-hour delay still lands inside the same UTC day (the issue date is
    # the fetch date), and 18:31 UTC stays as the last chance of the day.
    - cron: "47 9 * * *"
    - cron: "17 12 * * *"
    - cron: "43 14 * * *"
    - cron: "31 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-archive
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --project backend

      - name: Fetch ensemble forecast for every region location
        id: ingest
        continue-on-error: true
        run: >
          uv run --project backend python -m prisma.ingest
          --region argentina
          --sources openmeteo-ensemble
          --out data/raw

      - name: Stage issue-dated archive file
        if: hashFiles('data/raw/openmeteo-ensemble.parquet') != ''
        # The issue date comes from the parquet's issue_time, not from the
        # runner clock: a re-run of an already archived cycle resolves to the
        # same target path instead of creating a duplicate.
        run: |
          ISSUE_DATE=$(uv run --project backend python scripts/upload_forecast.py \
            --print-issue-date data/raw/openmeteo-ensemble.parquet)
          mkdir -p data/archive
          cp data/raw/openmeteo-ensemble.parquet \
            "data/archive/openmeteo-ensemble_${ISSUE_DATE}.parquet"
          echo "ISSUE_DATE=${ISSUE_DATE}" >> "$GITHUB_ENV"
          echo "Staged forecast archive for ${ISSUE_DATE} (from issue_time)"

      - name: Upload archive to Hugging Face dataset
        id: hf
        if: env.HF_TOKEN != '' && env.HF_DATASET_REPO != '' && env.ISSUE_DATE != ''
        # A transient Hugging Face error must not lose the day: the Release
        # fallback below picks it up, so the job stays green with a warning.
        continue-on-error: true
        run: >
          uv run --project backend --with huggingface_hub
          python scripts/upload_forecast.py
          --archive-dir data/archive
          --issue-date "$ISSUE_DATE"

      - name: Attach archive to a GitHub Release (fallback)
        if: (steps.hf.outcome == 'failure' || env.HF_TOKEN == '' || env.HF_DATASET_REPO == '') && env.ISSUE_DATE != ''
        run: |
          if [ "${{ steps.hf.outcome }}" = "failure" ]; then
            echo "::warning title=Hugging Face upload failed::archiving to the GitHub Release instead"
          fi
          TAG="forecast-${ISSUE_DATE}"
          FILE="data/archive/openmeteo-ensemble_${ISSUE_DATE}.parquet"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "Forecast archive ${ISSUE_DATE}" \
              --notes "Daily Open-Meteo ensemble forecast archive (${ISSUE_DATE}, UTC). Fallback storage while the Hugging Face dataset is not configured."
          fi
          echo "Attached ${FILE} to release ${TAG}"

      - name: Record archive coverage gaps (visibility only)
        # Runs after the ingest step (which rewrites the status file) and
        # before the heartbeat so the committed status carries the check.
        # Visibility only: a missing day is recorded, never repaired here,
        # and an HF listing failure must not redden the job.
        if: always()
        continue-on-error: true
        run: >
          uv run --project backend --with huggingface_hub
          python scripts/archive_watchdog.py

      - name: Commit ingest status heartbeat
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ingest_status.json || true
          if git diff --cached --quiet; then
            echo "ingest status unchanged"
          else
            git commit -m "chore: ingest status ${ISSUE_DATE:-$(date -u +%F)} [skip ci]"
            git push
          fi

      - name: Fail the job if ingest failed
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "Ingest failed; see results/ingest_status.json for the recorded failure."
          exit 1
